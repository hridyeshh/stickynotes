<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>stickynotes</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    main { max-width: 820px; margin: 0 auto; padding: 28px 16px 60px; }
    .top { justify-content: space-between; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 24px; }
    #search { flex: 1; min-width: 200px; padding: 8px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card); color: var(--fg); font: inherit; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px 18px; margin-bottom: 14px; }
    .card-head { justify-content: space-between; align-items: flex-start; }
    .card-head button { padding: 3px 8px; font-size: 12px; }
    .source { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; }
  </style>
</head>
<body>
  <main>
    <div class="row top">
      <h1>All notes</h1>
      <div class="row">
        <button id="exportMd">Export all (.md)</button>
        <button id="exportJson">Backup (.json)</button>
        <button id="importBtn">Restore</button>
        <input type="file" id="importFile" accept=".json" hidden>
      </div>
    </div>
    <div class="row" style="margin-bottom:18px">
      <input id="search" placeholder="Search notes and headings…">
    </div>
    <div id="list"></div>
  </main>
  <script src="sync.js"></script>
  <script src="shared.js"></script>
  <script src="notes.js"></script>
</body>
</html>
